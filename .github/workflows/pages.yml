name: Publish tournament
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix discord-bot --ignore-scripts
      - run: node --test fixture-import.test.cjs tournament.test.cjs discord-bot/bot.test.cjs discord-bot/image.test.cjs discord-bot/game-night.test.cjs
      - name: Prepare website
        run: node build.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id') || artifact_id=
            if [[ -n "$artifact_id" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded GitHub Pages artifact did not become visible."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
